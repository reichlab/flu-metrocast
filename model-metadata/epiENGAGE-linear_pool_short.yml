methods: "An equally weighted linear pool ensemble of trajectory-based forecasts submitted to the Flu-MetroCast Hub. The ensemble is constructed using `hubEnsembles::linear_pool()` by sampling 100 complete forecast trajectories from the contributing models, with equal model weights. The selected trajectories are directly used as the ensemble forecast, preserving the temporal dependence structure within each trajectory. The short-term ensemble covers forecast horizons 0–3."

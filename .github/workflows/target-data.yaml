name: 'Weekly Target Data 2026-27'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show changes without pushing or opening a PR'
        type: boolean
        default: false
  schedule:
    # Wednesday 16:30 UTC (11:30 EST / 12:30 EDT)
    - cron: '30 16 * * 3'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: ${{ github.repository == 'reichlab/flu-metrocast' }}
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      SLACK_BOT_TOKEN: ${{ secrets.NSSP_SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ secrets.NSSP_SLACK_CHANNEL }}

    steps:
      - name: 'Check season end date and set run dates'
        id: season
        shell: bash
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "DATE=$TODAY" >> "$GITHUB_ENV"
          # UTC Sunday=0, Wednesday=3; anchor to Wednesday of the same Sun-Sat week.
          DOW=$(date -u +%w)
          OFFSET=$((3 - DOW))
          WEDNESDAY=$(date -u -d "$TODAY $OFFSET days" +%Y-%m-%d)
          echo "REFERENCE_WEDNESDAY=$WEDNESDAY" >> "$GITHUB_ENV"
          echo "BRANCH=automation/target-data-${TODAY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          if [[ "$TODAY" > "2027-06-30" ]]; then
            echo "Season ended ($TODAY). Skipping update."
            echo 'active=false' >> "$GITHUB_OUTPUT"
          else
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi

      - name: 'Checkout main branch'
        if: ${{ steps.season.outputs.active == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 'Set up R'
        if: ${{ steps.season.outputs.active == 'true' }}
        uses: r-lib/actions/setup-r@v2

      - name: 'Install R dependencies'
        if: ${{ steps.season.outputs.active == 'true' }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::epidatr
            any::lubridate
            any::tidycensus
            any::readxl
            any::stringr

      - name: 'Check NSSP and NYC data freshness'
        if: ${{ steps.season.outputs.active == 'true' }}
        id: freshness
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          library(epidatr)
          library(dplyr)
          epidatr::disable_cache()

          today <- Sys.Date()
          reference_wednesday <- as.Date(Sys.getenv('REFERENCE_WEDNESDAY'))
          expected_nssp <- reference_wednesday - 4L
          min_nyc <- reference_wednesday - 11L
          max_nyc <- reference_wednesday - 4L

          nssp <- epidata_snapshot(
            source = 'nssp',
            signals = 'pct_ed_visits_influenza',
            geo_type = 'hsa_nci'
          )
          nssp_dates <- as.Date(nssp$reference_time)
          latest_nssp <- if (all(is.na(nssp_dates))) as.Date(NA) else max(nssp_dates, na.rm = TRUE)
          nssp_ok <- !is.na(latest_nssp) && latest_nssp == expected_nssp

          nyc_recent <- read.csv(
            'https://raw.githubusercontent.com/nychealth/respiratory-illness-data/main/data/ED_data_influenza.csv'
          )
          nyc_dates <- as.Date(nyc_recent$date)
          valid_nyc <- !is.na(nyc_dates) & !is.na(nyc_recent$Influenza.visits.overall)
          latest_nyc <- if (!any(valid_nyc)) as.Date(NA) else max(nyc_dates[valid_nyc])
          nyc_ok <- !is.na(latest_nyc) && latest_nyc >= min_nyc && latest_nyc <= max_nyc

          cat('Today:', as.character(today), '\n')
          cat('Reference Wednesday:', as.character(reference_wednesday), '\n')
          cat('Latest NSSP HSA:', as.character(latest_nssp),
              '(required:', as.character(expected_nssp), ')\n')
          cat('Latest NYC:', as.character(latest_nyc),
              '(allowed:', as.character(min_nyc), 'to', as.character(max_nyc), ')\n')
          cat('NSSP ready:', nssp_ok, '; NYC ready:', nyc_ok, '\n')

          cat(paste0('ready=', tolower(nssp_ok && nyc_ok), '\n'),
              file = Sys.getenv('GITHUB_OUTPUT'), append = TRUE)
          RSCRIPT

      - name: 'Create update branch'
        if: ${{ steps.freshness.outputs.ready == 'true' }}
        run: git checkout -b "$BRANCH"

      - name: 'Run target data script'
        if: ${{ steps.freshness.outputs.ready == 'true' }}
        run: Rscript ./src/get_target_data.R

      - name: 'Show changes'
        if: ${{ steps.freshness.outputs.ready == 'true' }}
        shell: bash
        run: |
          git diff --stat -- target-data/
          git diff -U0 -- target-data/ | sed -n '1,100p'

      - name: 'Configure git'
        if: ${{ steps.freshness.outputs.ready == 'true' }}
        run: |
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'

      - name: 'Commit and push changes'
        if: ${{ steps.freshness.outputs.ready == 'true' }}
        id: changes
        shell: bash
        run: |
          git add target-data/
          if git diff --cached --quiet; then
            echo 'No target-data changes. No PR needed.'
            echo 'status=none' >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" == 'true' ]]; then
            echo 'Dry run: changes found, but no commit/push/PR.'
            echo 'status=dry-run' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly target-data update for $DATE"
            git push -u origin "$BRANCH"
            echo 'status=pushed' >> "$GITHUB_OUTPUT"
          fi

      - name: 'Create pull request'
        if: ${{ steps.changes.outputs.status == 'pushed' }}
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PULL_REQUEST_LINK=$(gh pr create \
            --repo 'reichlab/flu-metrocast' \
            --head "$BRANCH" \
            --base 'main' \
            --title "Weekly target-data update for $DATE" \
            --body "Automated 2026-27 target-data update for $DATE. Note: PRs created using GITHUB_TOKEN may not trigger pull_request validation workflows automatically.")
          echo "PULL_REQUEST_LINK=$PULL_REQUEST_LINK" >> "$GITHUB_ENV"

      # Optional: configure NSSP_SLACK_BOT_TOKEN and NSSP_SLACK_CHANNEL repository secrets.
      - name: 'Slack alert (success)'
        if: ${{ success() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL != '' }}
        uses: slackapi/slack-github-action@v2.1
        with:
          method: 'chat.postMessage'
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_CHANNEL }}"
            text: ":white_check_mark: *NSSP/NYC target-data workflow completed* (${{ env.DATE }}). Status: ${{ steps.season.outputs.active != 'true' && 'season ended' || steps.freshness.outputs.ready != 'true' && 'freshness check not met' || steps.changes.outputs.status == 'pushed' && 'PR created' || steps.changes.outputs.status == 'dry-run' && 'dry run, nothing pushed' || 'no changes' }}. ${{ env.PULL_REQUEST_LINK }} <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Action log>"

      - name: 'Slack alert (failure)'
        if: ${{ failure() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL != '' }}
        uses: slackapi/slack-github-action@v2.1
        with:
          method: 'chat.postMessage'
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_CHANNEL }}"
            text: ":x: *NSSP/NYC target-data workflow failed* (${{ env.DATE }}). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed action>"

data_sources: "Flu MetroCast Hub target data (% ED visits due to flu: NSSP, NC DETECT, NYC DOHMH). California flu hospital admissions: CDPH Respiratory Virus Dashboard (NHSN admissions by region, data.chhs.ca.gov), with 2022-2024 history from the public HHS facility-level admissions file aggregated to the same regions."
methods: "Semi-mechanistic renewal/Rt model producing 100 coherent full-season sample trajectories per location. Growth rates are estimated from log incidence with a smoothing spline (smoothing set from each location's noise level) and mapped to Rt via the Euler-Lotka relation with a flu generation interval. Rt is forecast as a seasonal climatology pooled across locations plus a location offset and an AR(1) deviation; the forecast starts from a local-linear-trend Kalman filter state, and the level is projected with a renewal-consistent growth step and Ornstein-Uhlenbeck reversion toward a seasonal level, with per-location observation noise. ED %: equal mixture of 50 trajectories from this model and 50 from the original spline-anchored variant. Hospital admissions: the same model on log(count + 5). Samples are capped at twice each location's historical maximum."

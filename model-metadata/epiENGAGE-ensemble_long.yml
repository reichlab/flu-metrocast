methods: "An equally weighted linear pool ensemble of long-term trajectory-based forecasts submitted to the Flu-MetroCast Hub. Only models submitting forecasts beyond horizon 3 are considered for inclusion. The ensemble is constructed using `hubEnsembles::linear_pool()` by sampling 100 complete forecast trajectories from the contributing models, with equal model weights. The selected trajectories are directly used as the ensemble forecast, preserving the temporal dependence structure within each trajectory. The forecast horizon is determined each week based on the shortest maximum horizon among the contributing long-term models."
methods_url: "https://hubverse-org.github.io/hubEnsembles/articles/hubEnsembles.html"
data_sources: "Using latest_data.csv from MetroCast Hub."
